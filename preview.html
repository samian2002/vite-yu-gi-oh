<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yu-Gi-Oh! — Preview Design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #0a0a10;
      --bg-surface: #111118;
      --bg-card: #16161f;
      --bg-card-hover: #1c1c28;
      --border: rgba(200, 155, 60, 0.12);
      --border-hover: rgba(200, 155, 60, 0.35);
      --accent: #c89b3c;
      --accent-hover: #e0b44e;
      --text-primary: #e8e6f0;
      --text-muted: #6a6a80;
      --text-dim: #9898b0;
      --radius: 12px;
      --radius-sm: 8px;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* HEADER */
    .header {
      padding: 3rem 1.5rem 2rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .app-title {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #c89b3c 0%, #f0d080 50%, #c89b3c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
    }
    .app-subtitle {
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    /* MAIN */
    .main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    /* CONTROLS */
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .select-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .archetype-select {
      appearance: none;
      background-color: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.6rem 2.5rem 0.6rem 1rem;
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
      min-width: 220px;
    }
    .select-arrow {
      position: absolute;
      right: 0.75rem;
      color: var(--text-muted);
      pointer-events: none;
      font-size: 0.8rem;
    }
    .results-count {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.03em;
    }

    /* GRID */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.25rem;
    }

    /* CARD */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      border-color: var(--border-hover);
      transform: translateY(-3px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .card-image-wrapper {
      background-color: var(--bg-surface);
      overflow: hidden;
      aspect-ratio: 421 / 614;
    }
    .card-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }
    .card:hover .card-image { transform: scale(1.03); }
    .card-body {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex: 1;
    }
    .card-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.3;
    }
    .card-desc {
      font-size: 0.78rem;
      color: var(--text-dim);
      line-height: 1.5;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .toggle-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0;
      text-align: left;
      cursor: pointer;
    }
    .toggle-btn:hover { color: var(--accent-hover); }
    .card-link {
      display: inline-block;
      margin-top: 0.25rem;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-muted);
      text-decoration: none;
    }
    .card-link:hover { color: var(--accent); }
  </style>
</head>
<body>

  <header class="header">
    <div>
      <h1 class="app-title">Yu-Gi-Oh!</h1>
      <p class="app-subtitle">Card Explorer</p>
    </div>
  </header>

  <main class="main">
    <div class="controls">
      <div class="select-wrapper">
        <select class="archetype-select">
          <option>Tutti gli archetipi</option>
          <option>Blue-Eyes</option>
          <option>Dark Magician</option>
          <option>Exodia</option>
        </select>
        <span class="select-arrow">▾</span>
      </div>
      <span class="results-count">60 carte</span>
    </div>

    <div class="cards-grid" id="grid"></div>
  </main>

  <script>
    const cards = [
      { name: "Blue-Eyes White Dragon", img: "https://images.ygoprodeck.com/images/cards/89631139.jpg", desc: "This legendary dragon is a powerful engine of destruction. Virtually invincible, very few have faced this awesome creature and lived to tell the tale." },
      { name: "Dark Magician", img: "https://images.ygoprodeck.com/images/cards/46986414.jpg", desc: "The ultimate wizard in terms of attack and defense." },
      { name: "Exodia the Forbidden One", img: "https://images.ygoprodeck.com/images/cards/33396948.jpg", desc: "If you have \"Right Leg of the Forbidden One\", \"Left Leg of the Forbidden One\", \"Right Arm of the Forbidden One\" and \"Left Arm of the Forbidden One\" in addition to this card in your hand, you win the Duel." },
      { name: "Red-Eyes Black Dragon", img: "https://images.ygoprodeck.com/images/cards/74677422.jpg", desc: "A ferocious dragon with a deadly attack." },
      { name: "Summoned Skull", img: "https://images.ygoprodeck.com/images/cards/70781052.jpg", desc: "A fiend with dark powers for confusing the enemy. Among the Fiend-Type monsters, this monster boasts considerable force." },
      { name: "Celtic Guardian", img: "https://images.ygoprodeck.com/images/cards/91152256.jpg", desc: "An elf who learned to wield a sword, he baffles enemies with lightning-swift attacks." },
      { name: "Gaia The Fierce Knight", img: "https://images.ygoprodeck.com/images/cards/6368038.jpg", desc: "A knight whose horse travels faster than the wind. His battle-charge is a force to be reckoned with." },
      { name: "Kuriboh", img: "https://images.ygoprodeck.com/images/cards/40640057.jpg", desc: "Multiply by tributing this card (other than during the Damage Step). During that turn, all monsters the opponent controls cannot declare an attack." },
    ];

    const grid = document.getElementById('grid');
    cards.forEach(c => {
      grid.innerHTML += `
        <div class="card">
          <div class="card-image-wrapper">
            <img src="${c.img}" alt="${c.name}" class="card-image" loading="lazy" />
          </div>
          <div class="card-body">
            <h3 class="card-name">${c.name}</h3>
            <p class="card-desc">${c.desc}</p>
            <button class="toggle-btn">Leggi tutto</button>
            <a href="#" class="card-link">Vedi scheda →</a>
          </div>
        </div>`;
    });
  </script>

</body>
</html>
